[project]
name = "juizi.dashboard"
dynamic = ["version"]
description = "An activity record and dashboard for Plone site administrators: content and account activity in one list, by date range, with CSV download"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.12"
authors = [{ name = "Juizi", email = "karel@juizi.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Plone",
    "Framework :: Plone :: 6.1",
    "Framework :: Plone :: Addon",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "Products.CMFPlone",
    "plone.api",
    "plone.restapi",
]

[project.optional-dependencies]
test = ["horse-with-no-namespace", "plone.app.testing", "plone.app.contenttypes", "zope.testrunner"]

[project.scripts]
juizi-dashboard-record = "juizi.dashboard.scripts:main"

[project.urls]
Source = "https://github.com/juizi-com/juizi.dashboard"

[project.entry-points."z3c.autoinclude.plugin"]
target = "plone"

[tool.hatch.version]
path = "src/juizi/dashboard/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/juizi"]
