name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Rules live in ruff.toml: real errors only, no style or formatting.
      - run: uvx ruff@0.11.13 check src

  test:
    # Both setups Juizi runs: Plone 6.0 on Python 3.10 (p22) and Plone 6.1
    # on Python 3.12 (p24).
    strategy:
      fail-fast: false
      matrix:
        include:
          - plone: "6.0.15"
            python: "3.10"
          - plone: "6.1.5"
            python: "3.12"
    name: test (Plone ${{ matrix.plone }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    env:
      PLONE_VERSION: ${{ matrix.plone }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Plone and this package
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv/bin/python \
            -c https://dist.plone.org/release/${PLONE_VERSION}/constraints.txt \
            Products.CMFPlone plone.restapi plone.app.contenttypes zope.testrunner \
            horse-with-no-namespace -e ".[test]"
      - run: .venv/bin/zope-testrunner --test-path src
